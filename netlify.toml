[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Grundlegende Sicherheits-Header für alle Seiten
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Bilder und Schriften mit Hash im Dateinamen dürfen lange zwischengespeichert werden
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Eine Adresse für Suchmaschinen: Die Netlify-Adresse leitet auf www weiter (entschieden 30.10.2026).
# Vorschauen (deploy-preview-…--lifeandlemons.netlify.app) sind davon nicht betroffen.
# lifeandlemons.de ohne www leitet Netlify selbst auf www weiter (Hauptdomain in den Domain-Einstellungen).
# ---------------------------------------------------------------------------

[[redirects]]
  from = "https://lifeandlemons.netlify.app/*"
  to = "https://www.lifeandlemons.de/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Kurzlinks (für Broschüre, Instagram und Gespräche)
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/buch"
  to = "/programme/entwirf-dein-zukunfts-ich/#kursbuch"
  status = 302

[[redirects]]
  from = "/club"
  to = "/programme/entwirf-dein-zukunfts-ich/#club"
  status = 302

# ---------------------------------------------------------------------------
# Weiterleitungen alter oder naheliegender Adressen
# ---------------------------------------------------------------------------

# Adressen aus dem ersten Code-Gerüst (nie öffentlich, zur Sicherheit weitergeleitet)
[[redirects]]
  from = "/entwirf-dein-zukunfts-ich"
  to = "/programme/entwirf-dein-zukunfts-ich/"
  status = 301

[[redirects]]
  from = "/angebote"
  to = "/programme/entwirf-dein-zukunfts-ich/#formate"
  status = 301

# Übersicht der Programme gibt es (noch) nicht als eigene Seite
[[redirects]]
  from = "/programme"
  to = "/#programme"
  status = 302
