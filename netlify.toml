[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Grundlegende Sicherheits-Header für alle Seiten
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Bilder und Schriften mit Hash im Dateinamen dürfen lange zwischengespeichert werden
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Journal-Downloads: nur über den Link in der Begrüßungsmail, nicht in Suchmaschinen
[[headers]]
  for = "/downloads/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------------
# Eine Adresse für Suchmaschinen: Die Netlify-Adresse leitet auf www weiter (entschieden 30.10.2026).
# Vorschauen (deploy-preview-…--lifeandlemons.netlify.app) sind davon nicht betroffen.
# lifeandlemons.de ohne www leitet Netlify selbst auf www weiter (Hauptdomain in den Domain-Einstellungen).
# ---------------------------------------------------------------------------

[[redirects]]
  from = "https://lifeandlemons.netlify.app/*"
  to = "https://www.lifeandlemons.de/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Kurzlinks (für Broschüre, Instagram und Gespräche)
# ---------------------------------------------------------------------------

# Seit 21.11.2026 (Startplan Workbook und Shop): eine Seite für die Try-a-Life-Methode mit App und Workbook
[[redirects]]
  from = "/buch"
  to = "/try-a-life/#workbook"
  status = 302

[[redirects]]
  from = "/workbook"
  to = "/try-a-life/#workbook"
  status = 302

[[redirects]]
  from = "/app"
  to = "/try-a-life/#app"
  status = 302

[[redirects]]
  from = "/upgrade"
  to = "/try-a-life/#upgrade"
  status = 302

# Danke-Seite nach dem Digistore-Kauf des Workbooks, seit 17.11.2026 gelöscht (Workbook nur noch direkt per Mail)
[[redirects]]
  from = "/danke/kursbuch/*"
  to = "/angebote/"
  status = 301

[[redirects]]
  from = "/club"
  to = "/angebote/"
  status = 302

# Flyer für Studierende in Hannover (23.11.2026): ein QR-Code je Aushangort, alle führen zum Journal.
# Die Kampagnenangabe zeigt in der Messung (nur nach Einwilligung), welcher Ort Besuche bringt.
# Das Ziel lässt sich hier ändern, ohne die Flyer neu zu drucken.
[[redirects]]
  from = "/flyer/mensa"
  to = "/journal/?utm_source=flyer&utm_medium=print&utm_campaign=studierende-hannover&utm_content=mensa"
  status = 302

[[redirects]]
  from = "/flyer/bibliothek"
  to = "/journal/?utm_source=flyer&utm_medium=print&utm_campaign=studierende-hannover&utm_content=bibliothek"
  status = 302

[[redirects]]
  from = "/flyer/wohnheim"
  to = "/journal/?utm_source=flyer&utm_medium=print&utm_campaign=studierende-hannover&utm_content=wohnheim"
  status = 302

[[redirects]]
  from = "/flyer/cafe"
  to = "/journal/?utm_source=flyer&utm_medium=print&utm_campaign=studierende-hannover&utm_content=cafe"
  status = 302

[[redirects]]
  from = "/flyer/hochschule"
  to = "/journal/?utm_source=flyer&utm_medium=print&utm_campaign=studierende-hannover&utm_content=hochschule"
  status = 302

[[redirects]]
  from = "/flyer"
  to = "/journal/?utm_source=flyer&utm_medium=print&utm_campaign=studierende-hannover&utm_content=allgemein"
  status = 302

# ---------------------------------------------------------------------------
# Weiterleitungen alter oder naheliegender Adressen
# ---------------------------------------------------------------------------

# Adressen aus dem ersten Code-Gerüst (nie öffentlich, zur Sicherheit weitergeleitet)
[[redirects]]
  from = "/entwirf-dein-zukunfts-ich"
  to = "/try-a-life/"
  status = 301

# Seiten zu Modul 1 (gedrucktes Workbook), Modul 2 und zur Widerrufsbelehrung für das gedruckte Workbook,
# seit 21.11.2026 entfernt (Startplan Workbook und Shop, Entscheidungen 1 und 6)
[[redirects]]
  from = "/programme/entwirf-dein-zukunfts-ich/*"
  to = "/try-a-life/"
  status = 301

[[redirects]]
  from = "/programme/manifestiere-dein-zukunfts-ich/*"
  to = "/try-a-life/"
  status = 301

[[redirects]]
  from = "/widerruf/*"
  to = "/try-a-life/"
  status = 301

# Übersicht der Programme gibt es (noch) nicht als eigene Seite
[[redirects]]
  from = "/programme"
  to = "/#programme"
  status = 302

# ---------------------------------------------------------------------------
# Kurzlinks von HeyCatch (20.11.2026, nach heycatch.ai/agents.md): /a bis /z und /0 bis /9 leiten mit 302 auf die
# Startseite mit Kampagnenangabe um, damit HeyCatch Besuche aus geteilten Kurzlinks zuordnen kann.
# Einzeln aufgeführt, damit andere unbekannte Adressen weiter die Fehlerseite zeigen.
